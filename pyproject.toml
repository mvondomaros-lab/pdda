[project]
name = "pdda"
version = "0.8"
authors = [
    { name = "Michael von Domaros", email = "mvondomaros@uni-marburg.de" }
]
description = "Library for computing position dependent diffusivities from molecular dynamics simulations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"
dependencies = [
    "numpy>=2",
    "scipy>=1.13"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdda"]

[tool.hatch.build.targets.sdist]
include = [
    "pdda",
    "tests",
    "notebooks/*.py",
    "README.md",
    "CITATION.cff",
    "LICENSE"
]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge", "https://mvondomaros-lab.github.io/conda"]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
# The notebook plotting packages require Python 3.12 or later.
python = ">=3.12"
ipykernel = ">=6"
nbconvert = ">=7"
hatchling = ">=1.27"
pytest = ">=8"
scipy-stubs = "*"
matplotlib = ">=3.10.6"
pixi-pycharm = "*"
numpy = ">=2"
mvdlib-plots = ">=0.20"
mvdlib-core = ">=0.20"
pre-commit = ">=3"
pyarrow = ">=16"
ruff = ">=0.16.10"

[tool.pixi.pypi-dependencies]
pdda = { path = ".", editable = true }

[tool.pixi.tasks]
build-conda = { cmd = "pixi publish --target-dir dist/conda --force" }
build-wheel = { cmd = "python -m hatchling build" }
stage-artifacts = { depends-on = ["build-conda", "build-wheel"], cmd = """
rm -rf out
mkdir -p out/conda/noarch out/pypi
cp dist/conda/*.conda out/conda/noarch/
cp dist/*.whl out/pypi/
cp dist/*.tar.gz out/pypi/
""" }
build-artifacts = { depends-on = ["stage-artifacts"] }

[tool.pytest.ini_options]
pythonpath = ["notebooks"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = ">=0.8.6"

[tool.pixi.package.build.config]
ignore-pypi-mapping = false
